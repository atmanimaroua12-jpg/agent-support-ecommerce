# Jeu d'évaluation de l'agent : scénarios annotés (cahier des charges §5.3).
#
# Champs :
#   expected_tool      outil attendu : search_docs | get_order_status | create_ticket | none | any
#                      (ou une liste d'outils acceptables)
#   expected_source    doc_id qui doit apparaître dans les sources
#   must_contain_any   la réponse doit contenir AU MOINS UN de ces textes (sans accents ni majuscules)
#   must_not_contain   la réponse ne doit contenir AUCUN de ces textes
#   expect_blocked     la question doit être bloquée par les garde-fous
#   expect_draft       un brouillon de ticket doit (true) ou ne doit pas (false) être préparé

# ---------------------------------------------------------------- questions de politique (RAG)
- id: S01
  category: nominal_politique
  customer: C001
  question: "Combien de jours ai-je pour retourner un article ?"
  expected_tool: search_docs
  expected_source: POL-RET
  must_contain_any: ["30 jours"]
  must_not_contain: ["14 jours"]          # ancienne politique (document obsolète)

- id: S02
  category: nominal_politique
  customer: C001
  question: "Combien coûte la livraison express ?"
  expected_tool: search_docs
  expected_source: GUI-LIV
  must_contain_any: ["49"]

- id: S03
  category: nominal_politique
  customer: C003
  question: "Quelle est la durée de la garantie pour un smartphone ?"
  expected_tool: search_docs
