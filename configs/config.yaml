# Configuration de l'agent : versionnée avec Git. Aucun secret ici (la clé API est dans .env).

llm:
  model: openai/gpt-oss-120b
  temperature: 0.0
  max_tokens: 1024
  timeout_s: 30
  reasoning_effort: low 

agent:
  prompt_version: v2
  max_iterations: 5        # nombre max d'allers-retours LLM -> outils par question
  max_tool_calls: 6        # nombre max d'appels d'outils par question
  max_input_chars: 1500    # question plus longue -> refus

tools:
  timeout_s: 3.0           # délai max d'exécution d'un outil
  search_docs:
    top_k: 3
    min_score: 0.25        # en dessous : "information insuffisante"

paths:
  corpus: data/corpus
  orders: data/orders/orders.json
  pending_tickets: runtime/pending_tickets.json
  tickets: runtime/tickets.jsonl
  traces: runtime/traces.jsonl